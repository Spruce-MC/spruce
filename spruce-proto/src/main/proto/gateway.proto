syntax = "proto3";

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "org.spruce.proto";
option java_outer_classname = "GatewayProto";

service Gateway {
  rpc CallService (CallServiceRequest) returns (CallServiceResponse);
  rpc EventStream (EventStreamRequest) returns (stream EventStreamResponse);
  rpc EmitEvent (EmitEventRequest) returns (google.protobuf.Empty);

  rpc AcquireLock (AcquireLockRequest) returns (AcquireLockResponse);
  rpc ReleaseLock (ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc RefreshLock (RefreshLockRequest) returns (RefreshLockResponse);
}

message CallServiceRequest {
  string service = 1;
  string action = 2;
  string payload = 3;
}

message CallServiceResponse {
  string result = 1;
}

message EventStreamRequest {
  string serverId = 1;
}

message EventStreamResponse {
  string type = 1;
  string payload = 2;
}

message EmitEventRequest {
  string type = 1;
  string payload = 2;
}

message AcquireLockRequest {
  string key = 1;
  string owner_id = 2;
  int64 ttl_millis = 3;
  int64 wait_millis = 4;
}

message AcquireLockResponse {
  bool acquired = 1;
  string token = 2;
}

message ReleaseLockRequest {
  string key = 1;
  string token = 2;
}

message ReleaseLockResponse {
  bool released = 1;
}

message RefreshLockRequest {
  string key = 1;
  string token = 2;
  int64 ttl_millis = 3;
}

message RefreshLockResponse {
  bool refreshed = 1;
}
